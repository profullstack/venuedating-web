<div class="contact-container">
  
  <div class="contact-content">
    <div class="contact-info">
      <h2 data-i18n="contact.title">Get in Touch</h2>
      <p data-i18n="contact.description">Have questions about BarCrush? We're here to help! Fill out the form and our team will get back to you as soon as possible.</p>
      
      <div class="contact-details">
        <div class="contact-item">
          <i class="contact-icon email-icon"></i>
          <span data-i18n="contact.email">support@barcrush.app</span>
        </div>
        <div class="contact-item">
          <i class="contact-icon location-icon"></i>
          <span data-i18n="contact.location">San Francisco, CA</span>
        </div>
        <div class="contact-item">
          <i class="contact-icon hours-icon"></i>
          <span data-i18n="contact.hours">Mon-Fri: 9am - 5pm PT</span>
        </div>
      </div>
    </div>
    
    <div class="contact-form">
      <!-- Posts to /api/contact (@profullstack/contact-form). The token and
           honeypot are fetched from GET /api/contact when the view opens. -->
      <form id="contactForm" action="/api/contact" method="post">
        <div class="form-group">
          <label for="name" data-i18n="contact.name_label">Name</label>
          <input type="text" id="name" name="name" maxlength="120" autocomplete="name" required>
        </div>
        
        <div class="form-group">
          <label for="email" data-i18n="contact.email_label">Email</label>
          <input type="email" id="email" name="email" maxlength="254" autocomplete="email" required>
        </div>
        
        <div class="form-group">
          <label for="subject" data-i18n="contact.subject_label">Subject</label>
          <input type="text" id="subject" name="subject" maxlength="200" required>
        </div>
        
        <div class="form-group">
          <label for="message" data-i18n="contact.message_label">Message</label>
          <textarea id="message" name="message" rows="5" maxlength="5000" required></textarea>
        </div>
        
        <button type="submit" class="submit-btn" data-i18n="contact.submit_button">Send Message</button>
      </form>
    </div>
  </div>
</div>

<script type="module" src="/js/test-language-switch.js"></script>

<style>
.contact-container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 40px 20px;
}

.contact-container h1 {
  text-align: center;
  margin-bottom: 40px;
  color: #333;
  font-size: 32px;
}

.contact-content {
  display: flex;
  flex-wrap: wrap;
  gap: 40px;
}

.contact-info {
  flex: 1;
  min-width: 300px;
}

.contact-info h2 {
  color: #F44B74;
  margin-bottom: 20px;
  font-size: 24px;
}

.contact-info p {
  margin-bottom: 30px;
  line-height: 1.6;
  color: #555;
}

.contact-details {
  margin-top: 30px;
}

.contact-item {
  display: flex;
  align-items: center;
  margin-bottom: 20px;
}

.contact-icon {
  width: 24px;
  height: 24px;
  margin-right: 15px;
  background-size: contain;
  background-repeat: no-repeat;
}

.email-icon {
  background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23F44B74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>');
}

.location-icon {
  background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23F44B74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>');
}

.hours-icon {
  background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23F44B74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>');
}

.contact-form {
  flex: 1;
  min-width: 300px;
  background-color: #fff;
  padding: 30px;
  border-radius: 8px;
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  margin-bottom: 8px;
  font-weight: 500;
  color: #333;
}

.form-group input,
.form-group textarea {
  width: 100%;
  padding: 12px 15px;
  border: 1px solid #ddd;
  border-radius: 4px;
  font-size: 16px;
  transition: border-color 0.3s;
}

.form-group input:focus,
.form-group textarea:focus {
  border-color: #F44B74;
  outline: none;
}

.submit-btn {
  background-color: #F44B74;
  color: white;
  border: none;
  padding: 14px 24px;
  font-size: 16px;
  border-radius: 25px;
  cursor: pointer;
  transition: background-color 0.3s;
  width: 100%;
  font-weight: 600;
}

.submit-btn:hover {
  background-color: #e03a63;
}

@media (max-width: 768px) {
  .contact-content {
    flex-direction: column;
  }
  
  .contact-info,
  .contact-form {
    min-width: 100%;
  }
}

/* The contact form's honeypot: off-canvas, never display:none. */
.cf-hp {
  position: absolute;
  left: -9999px;
  width: 1px;
  height: 1px;
  overflow: hidden;
}
</style>

<script type="module">
import { mountGuard } from '/js/vendor/contact-form-browser.js';

// This view is loaded by the SPA router after the page has loaded, so it
// runs now rather than waiting for DOMContentLoaded (which has already
// fired, and used to leave the form doing nothing).
(async () => {
  const contactForm = document.getElementById('contactForm');
  if (!contactForm || contactForm.dataset.ready) return;
  contactForm.dataset.ready = '1';
  const submitBtn = contactForm.querySelector('.submit-btn');

  // The proof-of-render token and the honeypot, minted for this visit
  // (@profullstack/contact-form/browser). The honeypot is off-canvas (.cf-hp)
  // rather than display:none, because some bots skip fields they can tell
  // are not rendered.
  try {
    await mountGuard(contactForm, '/api/contact');
  } catch (error) {
    console.warn('contact form: could not fetch a token', error);
  }

  contactForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    e.stopPropagation();

    const name = document.getElementById('name').value;
    submitBtn.disabled = true;
    try {
      // JSON in, JSON out: { success: true }, or { error } with a 4xx/5xx.
      const response = await fetch('/api/contact', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify(Object.fromEntries(new FormData(contactForm)))
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) {
        alert(result.error ?? 'Your message could not be sent. Please try again.');
        return;
      }
      alert(`Thank you, ${name}! Your message has been sent. We'll get back to you soon.`);
      // Reset the form (the token and honeypot inputs keep their values)
      contactForm.reset();
    } catch {
      alert('Your message could not be sent. Please try again.');
    } finally {
      submitBtn.disabled = false;
    }
  });
})();
</script>
